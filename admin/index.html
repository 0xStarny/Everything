<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the guide loses people · Everything</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 20'%3E%3Cpath d='M11.7 0.1L0.14 4.32C0.06 4.36 0 4.44 0 4.53v3.9c0 .16.15.26.29.21L11.87 4.43c.08-.03.14-.11.14-.21V.32c0-.15-.15-.26-.29-.21z' fill='%230f5ff7'/%3E%3Cpath d='M12.01 10.78V6.87c0-.15-.15-.26-.29-.2L0 10.93l6 2.19 5.87-2.13c.08-.03.14-.11.14-.21z' fill='%23387efc'/%3E%3Cpath d='M11.87 15.25L0 10.93v4.22c0 .09.06.17.14.2l11.57 4.22c.14.05.29-.06.29-.21v-3.91c0-.09-.06-.17-.14-.2z' fill='%230f5ff7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --canvas:#fff;--surface:#f3f5fa;--elevated:#fff;--subtle:#e4e8f1;
  --primary:#1d2029;--secondary:#3e4350;--muted:#7a8294;--disabled:#a0a9bb;
  --hairline:#e4e8f1;--border:#cbd2e0;--strong:#a0a9bb;
  --accent:#0f5ff7;--accent-soft:#e0e9fd;--accent-text:#0a3fa8;
  --ok:#00a445;--ok-text:#00803a;--ok-bg:#e8fcef;
  --bad:#dc2626;--bad-text:#b91c1c;--bad-bg:#fee2e2;
  --warn-text:#92400e;--warn-bg:#fde68a;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --canvas:#1d2029;--surface:#222630;--elevated:#2e323e;--subtle:#272b36;
  --primary:#fff;--secondary:#cbd2e0;--muted:#a0a9bb;--disabled:#7a8294;
  --hairline:#353947;--border:#3e4350;--strong:#565c6e;
  --accent:#0f5ff7;--accent-soft:#041e53;--accent-text:#b7cdfd;
  --ok:#3fd86a;--ok-text:#7be8a0;--ok-bg:#00421e;
  --bad:#f87171;--bad-text:#fca5a5;--bad-bg:#7f1d1d;
  --warn-text:#fde68a;--warn-bg:#78350f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--primary);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.022em;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

.wrap{max-width:1080px;margin:0 auto;padding:32px 22px 96px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.mark{width:15px;height:25px;color:var(--primary);flex:none}
.mark svg{width:100%;height:100%;display:block}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-text)}
header.top h1{font-size:clamp(21px,3vw,27px)}
.spacer{flex:1}
.btn{appearance:none;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--elevated);color:var(--primary);
  border-radius:var(--r-md);padding:7px 13px}
.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* the lock */
.gate{max-width:420px;margin:14vh auto;padding:26px;border:1px solid var(--hairline);
  border-radius:var(--r-xl);background:var(--surface)}
.gate h2{font-size:19px;margin-bottom:8px}
.gate p{font-size:13px;color:var(--muted);margin-bottom:18px}
.gate input{width:100%;font-family:var(--mono);font-size:14px;padding:11px 13px;
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--canvas);
  color:var(--primary);margin-bottom:12px}
.gate .btn{width:100%;justify-content:center;padding:10px}
.err{color:var(--bad-text);font-size:12.5px;margin-top:10px}

/* headline numbers */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:30px}
.kpi{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:14px 16px}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:5px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}

h2.sec{display:flex;align-items:baseline;gap:12px;font-size:18px;margin:34px 0 6px}
h2.sec span{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);
  text-transform:none;letter-spacing:0}
p.lead{font-size:13px;color:var(--muted);max-width:74ch;margin-bottom:14px}

.card{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);
  padding:16px 18px;margin-bottom:10px}
.card h3{font-size:14.5px;margin-bottom:3px}
.card .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px}

/* the drop-off curve */
.curve{display:flex;flex-direction:column;gap:4px}
.crow{display:grid;grid-template-columns:52px 1fr 74px;gap:10px;align-items:center}
.crow .cs{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.crow .cb{height:16px;border-radius:3px;background:var(--subtle);overflow:hidden}
.crow .cb i{display:block;height:100%;background:var(--accent);opacity:.85}
.crow.drop .cb i{background:var(--bad)}
.crow .cn{font-family:var(--mono);font-size:11px;color:var(--secondary)}

/* the questions people get wrong */
.q{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);
  padding:16px 18px;margin-bottom:10px;border-left:3px solid var(--bad)}
.q.mild{border-left-color:var(--warn-bg)}
.q .qh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.q .pct{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--bad-text);line-height:1}
.q.mild .pct{color:var(--warn-text)}
.q .asked{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q .qt{font-size:14.5px;font-weight:700;line-height:1.35;margin-bottom:9px}
.q .row{font-size:12.5px;display:flex;gap:8px;padding:4px 0}
.q .row b{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;width:66px;padding-top:2px}
.q .good b{color:var(--ok-text)}
.q .wrong b{color:var(--bad-text)}
.q .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}

/* the passages that lose people */
.psg{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,74px);gap:10px;align-items:center;
  padding:9px 12px;border:1px solid var(--hairline);border-radius:var(--r-md);
  background:var(--surface);margin-bottom:5px}
.psg.hot{border-left:3px solid var(--bad)}
.psg .pw{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psg .pw em{font-style:normal;color:var(--muted);font-weight:500}
.psg .pn{font-family:var(--mono);font-size:12px;text-align:right}
.psg .pn b{font-weight:700}
.psghead{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,74px);gap:10px;
  padding:0 12px 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.psghead span:not(:first-child){text-align:right}

/* per-step table inside a view card */
.steps{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.steps th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);text-align:right;padding:5px 8px;border-bottom:1px solid var(--hairline);font-weight:600}
.steps th:first-child{text-align:left}
.steps td{padding:5px 8px;border-bottom:1px solid var(--hairline);text-align:right;
  font-family:var(--mono);color:var(--secondary)}
.steps td:first-child{text-align:left;font-family:var(--sans)}
.steps tr:last-child td{border-bottom:0}
.steps td.hot{color:var(--bad-text);font-weight:700}
.steps .bar2{height:7px;border-radius:2px;background:var(--subtle);overflow:hidden;min-width:40px}
.steps .bar2 i{display:block;height:100%;background:var(--accent);opacity:.8}

/* plain frequency lists */
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 86px 52px;gap:10px;align-items:center;font-size:13px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bb{position:relative;height:14px;border-radius:3px;background:var(--subtle);overflow:hidden}
.bar .bb i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent);opacity:.75}
.bar .bn{font-family:var(--mono);font-size:11px;color:var(--secondary);text-align:right}
.bar.simple{grid-template-columns:minmax(0,1fr) 74px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.empty{font-size:13px;color:var(--muted);padding:14px 0}
.note{border:1px solid var(--hairline);border-radius:var(--r-lg);padding:14px 16px;
  font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:34px}
.note b{color:var(--primary)}
.note code{font-family:var(--mono);font-size:11.5px;background:var(--subtle);padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const MARK = `<svg viewBox="0 0 12 20" fill="currentColor" aria-hidden="true">
  <path d="M11.72.11.14 4.32a.21.21 0 0 0-.14.21v3.9c0 .16.15.26.29.21L11.87 4.43a.21.21 0 0 0 .14-.21V.32c0-.15-.15-.26-.29-.21Z"/>
  <path d="M12.01 10.78V6.87c0-.15-.15-.26-.29-.2L0 10.93l6 2.19 5.87-2.13a.21.21 0 0 0 .14-.21Z" opacity=".55"/>
  <path d="M11.87 15.25 0 10.93v4.22c0 .09.06.17.14.2l11.58 4.22c.14.05.29-.06.29-.21v-3.9a.21.21 0 0 0-.14-.21Z"/>
</svg>`;
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const num = n => (+n || 0).toLocaleString('en-US');

/* The key lives in sessionStorage and dies with the tab. It never goes in the
   URL, so it cannot end up in a history, a screenshot of the address bar, or a
   referrer header. */
const KEY = {
  get: () => { try { return sessionStorage.getItem('ev-stats-key') || ''; } catch (e) { return ''; } },
  set: v => { try { sessionStorage.setItem('ev-stats-key', v); } catch (e) {} },
  clear: () => { try { sessionStorage.removeItem('ev-stats-key'); } catch (e) {} }
};

function gate(msg) {
  app.innerHTML = `<div class="gate">
    <div class="eyebrow">Everything · the guide</div>
    <h2>Where the guide loses people</h2>
    <p>Enter the stats key. It is the <code>STATS_KEY</code> environment variable set on the deployment, and it stays in this tab only.</p>
    <input type="password" id="k" placeholder="stats key" autocomplete="current-password" spellcheck="false">
    <button class="btn primary" id="go">Open</button>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
  </div>`;
  const go = () => { const v = document.getElementById('k').value.trim(); if (!v) return; KEY.set(v); load(); };
  document.getElementById('go').onclick = go;
  document.getElementById('k').onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('k').focus();
}

async function load() {
  const key = KEY.get();
  if (!key) return gate('');
  app.innerHTML = `<p class="stamp" style="padding:14vh 0;text-align:center">Reading the counters…</p>`;
  let r, d;
  try { r = await fetch('/api/stats?key=' + encodeURIComponent(key), { cache: 'no-store' }); }
  catch (e) { KEY.clear(); return gate('Could not reach /api/stats.'); }
  if (r.status === 401) { KEY.clear(); return gate('That key was refused.'); }
  if (r.status === 503) { KEY.clear(); return gate('The collector has no store configured yet. Set KV_REST_API_URL and KV_REST_API_TOKEN on the deployment.'); }
  if (!r.ok) { KEY.clear(); return gate('The stats endpoint answered ' + r.status + '.'); }
  try { d = await r.json(); } catch (e) { KEY.clear(); return gate('The stats endpoint did not return JSON.'); }
  render(d);
}

/* a labelled frequency list with a bar behind the count */
function freq(obj, limit) {
  const rows = Object.entries(obj || {}).slice(0, limit || 12);
  if (!rows.length) return `<p class="empty">Nothing recorded yet.</p>`;
  const max = Math.max(...rows.map(r => r[1])) || 1;
  return `<div class="bars">${rows.map(([k, v]) => `<div class="bar">
      <span class="lb" title="${esc(k)}">${esc(k)}</span>
      <span class="bb"><i style="width:${Math.max(3, (v / max) * 100)}%"></i></span>
      <span class="bn">${num(v)}</span>
    </div>`).join('')}</div>`;
}

function render(d) {
  const views = d.dropoff || {};
  const readers = Object.values(views).reduce((a, v) => a + v.readers, 0);
  const finished = Object.values(views).reduce((a, v) => a + v.reached_last, 0);
  const S = d.session || {};
  const str = d.struggle || {};

  const secs = n => n == null ? '—' : n >= 60 ? Math.floor(n / 60) + 'm ' + (n % 60) + 's' : n + 's';

  app.innerHTML = `
  <header class="top">
    <span class="mark">${MARK}</span>
    <div>
      <div class="eyebrow">Everything · the guide</div>
      <h1>Where the guide loses people</h1>
    </div>
    <span class="spacer"></span>
    <span class="stamp">${esc(new Date(d.generated).toLocaleString())}</span>
    <button class="btn" id="reload">Refresh</button>
    <button class="btn" id="out">Lock</button>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="k">Visits</div><div class="v mono">${num(S.visits)}</div>
      <div class="s">${S.avg_views != null ? S.avg_views + ' views each' : 'one reader, one session'}</div></div>
    <div class="kpi"><div class="k">Time per visit</div><div class="v mono">${secs(S.avg_secs)}</div>
      <div class="s">${S.bounce_pct != null ? S.bounce_pct + ' % bounced' : 'average'}</div></div>
    <div class="kpi"><div class="k">Read to the end</div><div class="v mono">${readers ? Math.round((finished / readers) * 100) : 0} %</div>
      <div class="s">${num(finished)} of ${num(readers)} view visits</div></div>
    <div class="kpi"><div class="k">Questions answered</div><div class="v mono">${num((d.events || {}).quiz_answer)}</div>
      <div class="s">${num((d.events || {}).badge_unlock)} badges unlocked</div></div>
  </div>

  <h2 class="sec">The passages that lose people <span>a step somebody went back to is a step that did not land</span></h2>
  <p class="lead">Going forward is reading. Going <em>backward</em> is a decision that something did not make sense, and the step they land on is the one that failed them. Replays are the same signal one notch softer. Ranked by both.</p>
  ${(d.passages || []).length ? `
    <div class="psghead"><span>Step</span><span>Returned to</span><span>Replayed</span><span>Avg time</span></div>
    ${(d.passages || []).map(p => `<div class="psg${p.returns >= 3 ? ' hot' : ''}">
      <span class="pw">${esc(p.view)} <em>· step ${p.step}</em></span>
      <span class="pn"><b>${num(p.returns)}</b></span>
      <span class="pn">${num(p.replays)}</span>
      <span class="pn">${p.avg_secs == null ? '—' : p.avg_secs + 's'}</span>
    </div>`).join('')}` : `<p class="empty">Nobody has stepped backward yet.</p>`}

  <h2 class="sec">What people get wrong <span>the questions that name a failed explanation</span></h2>
  <p class="lead">Sorted by how often the answer is missed, with the sentence people reached for instead. A question above 50 % is not a hard question, it is a view that has not landed. Only questions asked at least three times appear.</p>
  ${(d.hardest || []).length ? (d.hardest || []).slice(0, 14).map(q => `
    <div class="q${q.wrong_pct < 50 ? ' mild' : ''}">
      <div class="qh">
        <span class="pct">${q.wrong_pct} %</span>
        <span class="asked">wrong · asked ${num(q.asked)} times · from “${esc(q.view || '?')}”</span>
      </div>
      <div class="qt">${esc(q.question || q.q)}</div>
      <div class="row good"><b>Answer</b><span>${esc(q.answer || '—')}</span></div>
      ${(q.picked_instead || []).map(p => `<div class="row wrong"><b>Picked</b><span>${esc(p.picked)}</span><span class="cnt">${num(p.count)}</span></div>`).join('')}
    </div>`).join('') : `<p class="empty">No test answers recorded yet.</p>`}

  <h2 class="sec">Every view, step by step</h2>
  <p class="lead">Readers is how many got exactly that far before leaving — a cliff between two rows is the step that lost them. Time is the average spent on that step. Back is how many came round to it again.</p>
  ${Object.keys(views).length ? Object.entries(views).sort((a, b) => b[1].readers - a[1].readers).map(([id, v]) => {
    const max = Math.max(...v.curve.map(c => c.readers), 1);
    const st = str[id] || { steps: [] };
    const byStep = {};
    (st.steps || []).forEach(x => { byStep[x.step] = x; });
    return `<div class="card">
      <h3>${esc(id)}</h3>
      <div class="meta">${num(v.readers)} visits · ${v.readers ? Math.round((v.reached_last / v.readers) * 100) : 0} % to the end${v.avg_secs != null ? ` · ${secs(v.avg_secs)} average` : ''}${st.churn != null ? ` · churn ${st.churn}×` : ''}${st.avg_scroll != null ? ` · scrolled ${st.avg_scroll} %` : ''}${st.hesitation != null ? ` · ${st.hesitation}s before the first move` : ''}</div>
      <table class="steps">
        <thead><tr><th>Step</th><th>Readers</th><th></th><th>Time</th><th>Back</th><th>Replays</th></tr></thead>
        <tbody>${v.curve.map((c, i) => {
          const prev = i ? v.curve[i - 1].readers : c.readers;
          const cliff = i > 0 && prev > 0 && c.readers < prev * 0.55;
          const x = byStep[c.step] || {};
          return `<tr>
            <td>step ${c.step}</td>
            <td class="${cliff ? 'hot' : ''}">${num(c.readers)}${cliff ? ' ↓' : ''}</td>
            <td style="width:38%"><span class="bar2"><i style="width:${Math.max(2, (c.readers / max) * 100)}%"></i></span></td>
            <td>${x.avg_secs == null ? '—' : x.avg_secs + 's'}</td>
            <td class="${x.returns >= 3 ? 'hot' : ''}">${x.returns ? num(x.returns) : '—'}</td>
            <td>${x.replays ? num(x.replays) : '—'}</td>
          </tr>`; }).join('')}</tbody>
      </table>
      ${Object.keys((d.arrived_via || {})[id] || {}).length
        ? `<div class="meta" style="margin:12px 0 0">Arrived via ${Object.entries(d.arrived_via[id]).map(([k, n]) => esc(k) + ' ' + num(n)).join(' · ')}</div>` : ''}
    </div>`; }).join('') : `<p class="empty">No view visits recorded yet.</p>`}

  <h2 class="sec">What they went looking for <span>and what they had to look up</span></h2>
  <p class="lead">A search is a reader saying the guide did not put something where they expected it. A glossary click is a term used before it was explained.</p>
  <div class="grid2">
    <div class="card"><h3>Searched</h3><div class="meta">palette queries</div>${freq(d.searched, 14)}</div>
    <div class="card"><h3>Looked up</h3><div class="meta">glossary terms clicked</div>${freq(d.looked_up, 14)}</div>
  </div>

  <h2 class="sec">Who is reading <span>from the request, never from the reader</span></h2>
  <div class="grid2">
    <div class="card"><h3>Country</h3><div class="meta">&nbsp;</div>${freq((d.geo || {}).country, 14)}</div>
    <div class="card"><h3>City</h3><div class="meta">rough at low traffic</div>${freq((d.geo || {}).city, 14)}</div>
    <div class="card"><h3>Region</h3><div class="meta">&nbsp;</div>${freq((d.geo || {}).region, 10)}</div>
    <div class="card"><h3>Time zone</h3><div class="meta">&nbsp;</div>${freq((d.geo || {}).timezone, 10)}</div>
  </div>

  <h2 class="sec">How they got here</h2>
  <div class="grid2">
    <div class="card"><h3>Referrer</h3><div class="meta">hostname only</div>${freq((d.acquisition || {}).referrer, 12)}</div>
    <div class="card"><h3>Campaign source</h3><div class="meta">utm_source · ref</div>${freq((d.acquisition || {}).source, 10)}</div>
    <div class="card"><h3>Landed on</h3><div class="meta">first page of the visit</div>${freq((d.acquisition || {}).landing, 12)}</div>
    <div class="card"><h3>Left from</h3><div class="meta">last view of the visit</div>${freq(d.exit, 12)}</div>
  </div>

  <h2 class="sec">The reading path <span>which view leads to which</span></h2>
  <div class="card">${freq(d.path, 20)}</div>

  <h2 class="sec">On what</h2>
  <div class="grid2">
    <div class="card"><h3>Device</h3><div class="meta">&nbsp;</div>${freq((d.tech || {}).device, 5)}</div>
    <div class="card"><h3>Browser</h3><div class="meta">&nbsp;</div>${freq((d.tech || {}).browser, 8)}</div>
    <div class="card"><h3>Operating system</h3><div class="meta">&nbsp;</div>${freq((d.tech || {}).os, 8)}</div>
    <div class="card"><h3>Window width</h3><div class="meta">&nbsp;</div>${freq((d.tech || {}).width, 6)}</div>
    <div class="card"><h3>Wallet installed</h3><div class="meta">the gate on the tests</div>${freq((d.tech || {}).wallet_installed, 3)}</div>
    <div class="card"><h3>System preference</h3><div class="meta">dark · reduced motion</div>${freq((d.tech || {}).prefers, 4)}</div>
  </div>

  <h2 class="sec">The tests</h2>
  <div class="grid2">
    <div class="card"><h3>Passed against failed</h3><div class="meta">per test</div>${
      Object.keys(d.tests || {}).length
        ? Object.entries(d.tests).map(([t, o]) => `<div class="bar simple"><span class="lb">${esc(t)}</span><span class="bn">${num(o.passed || 0)} / ${num((+o.passed || 0) + (+o.failed || 0))}</span></div>`).join('')
        : `<p class="empty">Nothing recorded yet.</p>`}</div>
    <div class="card"><h3>Walked out</h3><div class="meta">the question they quit on</div>${
      Object.keys(d.abandoned || {}).length
        ? Object.entries(d.abandoned).map(([t, o]) => `<div class="bar simple"><span class="lb">${esc(t)}</span><span class="bn">${Object.entries(o).map(([q, n]) => q + '×' + n).join(' ')}</span></div>`).join('')
        : `<p class="empty">Nobody has abandoned a test.</p>`}</div>
    <div class="card"><h3>Which of the six</h3><div class="meta">who readers turn out to be</div>${freq(d.which, 8)}</div>
    <div class="card"><h3>Diagrams copied</h3><div class="meta">which ones travel</div>${freq(d.copied, 10)}</div>
  </div>

  <h2 class="sec">When</h2>
  <div class="grid2">
    <div class="card"><h3>By day</h3><div class="meta">&nbsp;</div>${freq((d.when || {}).day, 14)}</div>
    <div class="card"><h3>By hour, UTC</h3><div class="meta">&nbsp;</div>${freq((d.when || {}).hour, 24)}</div>
    <div class="card"><h3>By weekday</h3><div class="meta">&nbsp;</div>${freq((d.when || {}).weekday, 7)}</div>
    <div class="card"><h3>Language &amp; theme</h3><div class="meta">switches, not defaults</div>${freq({ ...(d.lang || {}), ...(d.theme || {}) }, 6)}</div>
  </div>

  <h2 class="sec">Odds and ends</h2>
  <div class="grid2">
    <div class="card"><h3>The borrow lab</h3><div class="meta">the one interactive block</div>
      <div class="bar simple"><span class="lb">Sliders touched</span><span class="bn">${num((d.lab || {}).used)}</span></div>
      ${freq((d.lab || {}).tick, 8)}</div>
    <div class="card"><h3>Returning</h3><div class="meta">this browser has been here before</div>${freq((d.session || {}).returning, 3)}</div>
    <div class="card"><h3>Entry view</h3><div class="meta">where visits start</div>${freq(d.entry, 12)}</div>
    <div class="card"><h3>Bots turned away</h3><div class="meta">not counted anywhere else</div>${freq((d.tech || {}).bots, 6)}</div>
  </div>

  <div class="note">
    <b>What this is not.</b> A key on a query string is not an authentication
    system. It keeps the page off the open web, and that is all it is asked to
    do — every number here is an anonymous counter, never a person. Nothing
    stored can be traced back to a reader: no address, no IP, no identifier
    that survives the tab. Country and city come from the request headers and
    are counted once per visit; at low traffic a city is close to naming
    somebody, so read that card as a rough signal and nothing more. If the key
    leaks, rotate <code>STATS_KEY</code> and redeploy.
  </div>`;

  document.getElementById('reload').onclick = load;
  document.getElementById('out').onclick = () => { KEY.clear(); gate(''); };
}

load();
</script>
</body>
</html>
