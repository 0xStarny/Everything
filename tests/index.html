<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* light palette — app.everything.inc light tokens */
  --canvas:#fff;--surface:#f3f5fa;--elevated:#fff;--subtle:#e4e8f1;
  --primary:#1d2029;--secondary:#3e4350;--muted:#7a8294;--disabled:#a0a9bb;
  --hairline:#e4e8f1;--border:#cbd2e0;--strong:#a0a9bb;
  --accent:#0f5ff7;--accent-soft:#e0e9fd;--accent-text:#0a3fa8;--accent-line:#387efc;
  --ok:#00a445;--ok-text:#00803a;--ok-bg:#e8fcef;--ok-line:#7be8a0;
  --bad:#dc2626;--bad-text:#b91c1c;--bad-bg:#fee2e2;--bad-line:#fca5a5;
  --warn:#d97706;--warn-text:#92400e;--warn-bg:#fde68a;--warn-line:#fbbf24;
  --info:#1f6fd6;--info-text:#1856ad;--info-bg:#eaf2ff;--info-line:#a9cbff;
  --grid:#e4e8f1;--shade:#0000000a;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#1d2029;--surface:#222630;--elevated:#2e323e;--subtle:#272b36;
  --primary:#fff;--secondary:#cbd2e0;--muted:#a0a9bb;--disabled:#7a8294;
  --hairline:#353947;--border:#3e4350;--strong:#565c6e;
  --accent:#0f5ff7;--accent-soft:#041e53;--accent-text:#b7cdfd;--accent-line:#387efc;
  --ok:#3fd86a;--ok-text:#7be8a0;--ok-bg:#00421e;--ok-line:#00803a;
  --bad:#f87171;--bad-text:#fca5a5;--bad-bg:#7f1d1d;--bad-line:#b91c1c;
  --warn:#fbbf24;--warn-text:#fde68a;--warn-bg:#78350f;--warn-line:#b45309;
  --info:#6fa8ff;--info-text:#a9cbff;--info-bg:#0d2b5c;--info-line:#1856ad;
  --grid:#353947;--shade:#ffffff08;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--primary);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-0.02em;text-wrap:balance}
p{margin:0}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px;border-radius:var(--r-sm)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;background:var(--canvas);border-bottom:1px solid var(--hairline)}
.logo{height:18px;width:auto;color:var(--primary);display:block}
.pill-beta{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent-text);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.topbar .spacer{flex:1}
.topbar .crumb{font-size:12px;color:var(--muted);white-space:nowrap}
.topbar .crumb b{color:var(--secondary);font-weight:600}
.prog{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);
  border:1px solid var(--hairline);border-radius:var(--r-md);padding:4px 9px;white-space:nowrap}
.prog b{color:var(--accent-text);font-weight:600}
@media (max-width:720px){.topbar .crumb{display:none}}

.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);padding:5px 10px;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--primary)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.iconbtn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:var(--r-md);width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:color .15s,border-color .15s}
.iconbtn:hover{color:var(--primary);border-color:var(--strong)}
.iconbtn svg{width:15px;height:15px}
:root[data-theme="dark"] .ico-sun{display:none}
:root:not([data-theme="dark"]) .ico-moon{display:none}

.menubtn{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;
  padding:6px;margin-left:-6px;border-radius:var(--r-sm);display:none;transition:color .15s}
.menubtn:hover{color:var(--primary)}

/* ── shell ────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1320px;margin:0 auto;align-items:start}
.col{min-width:0}
.sidenav{position:sticky;top:48px;height:calc(100dvh - 48px);overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--hairline);padding:16px 10px 28px;scrollbar-width:thin}
.navgroup{margin-bottom:18px}
.navlabel{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--disabled);padding:0 10px 7px}
.navitem{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;width:100%;
  text-align:left;cursor:pointer;font-family:inherit;border:0;background:none;color:var(--secondary);
  padding:7px 10px;border-radius:var(--r-md);transition:background .13s,color .13s}
.navitem:hover{background:var(--shade);color:var(--primary)}
.navitem .ni{font-size:10px;font-weight:600;color:var(--disabled);text-align:center}
.navitem .nt{font-size:13.5px;font-weight:500;line-height:1.3}
.navitem .nk{font-size:11px;color:var(--ok);font-weight:700}
.navitem[aria-current="true"]{background:var(--accent-soft);color:var(--primary)}
.navitem[aria-current="true"] .nt{font-weight:700}
.navitem[aria-current="true"] .ni{color:var(--accent-text)}
.navitem.seen .ni{color:var(--ok-text)}
/* the call to action stays reachable however long the list gets */
.navpin{position:sticky;bottom:-28px;margin-bottom:0;padding-bottom:16px;
  background:var(--canvas);border-top:1px solid var(--hairline);padding-top:12px;margin-top:6px}
.navcta{border:1px solid var(--accent-line);background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.navcta .nt{font-weight:700;color:var(--accent-text)}
.navcta[aria-current="true"]{background:var(--accent-soft)}
.navcta .nk{font-family:var(--mono);color:var(--accent-text)}

/* the steps of the open view, nested under it */
.navsteps{display:none;margin:2px 0 6px 21px;padding-left:11px;border-left:1px solid var(--hairline)}
.navsteps.open{display:block}
.navstep{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:baseline;width:100%;text-align:left;
  cursor:pointer;font-family:inherit;border:0;background:none;color:var(--muted);
  padding:5px 8px;border-radius:var(--r-sm);transition:background .12s,color .12s}
.navstep:hover{background:var(--shade);color:var(--secondary)}
.navstep b{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--disabled)}
.navstep span{font-size:12px;line-height:1.35}
.navstep[aria-current="true"]{color:var(--primary)}
.navstep[aria-current="true"] span{font-weight:600}
.navstep[aria-current="true"] b{color:var(--accent-text)}
.navstep.done{color:var(--secondary)}
.navveil{display:none}

@media (max-width:1000px){
  .menubtn{display:inline-flex}
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidenav{position:fixed;top:48px;left:0;width:280px;z-index:90;background:var(--canvas);
    transform:translateX(-101%);transition:transform .22s var(--ease);box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .sidenav.open{transform:none}
  .navveil{display:block;position:fixed;inset:48px 0 0;z-index:85;background:var(--overlay,rgba(0,0,0,.35))}
  .navveil[hidden]{display:none}
}

.wrap{max-width:1060px;margin:0 auto;padding:24px 22px 72px}
.panel[hidden]{display:none}

.rolehead{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-bottom:20px}
.rolehead .lead{flex:1 1 420px;min-width:280px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rolehead h2{font-size:30px;line-height:1.1;margin-bottom:8px}
.rolehead .sub{color:var(--secondary);font-size:15px;max-width:64ch}
.idcard{display:flex;gap:8px;flex-wrap:wrap}
.stat{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:8px 12px;min-width:112px}
.stat .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:13.5px;font-weight:600;margin-top:2px}
.v.g{color:var(--ok-text)}.v.r{color:var(--bad-text)}.v.w{color:var(--warn-text)}.v.b{color:var(--accent-text)}

.work{display:block}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg)}
.card > .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hairline)}
.hd h3{font-size:13px;font-weight:700;letter-spacing:0}
.hd .tag{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:1px 6px;white-space:nowrap}
.stagebox{padding:14px}
svg.stage{display:block;width:100%;height:auto;max-height:64vh;overflow:visible}
/* CSS beats an SVG presentation attribute, so these defaults must stand aside
   whenever the markup states a fill of its own — otherwise every semantic
   colour in the diagrams silently renders as the default. */
svg.stage text{font-family:var(--sans)}
svg.stage text:not([fill]){fill:var(--primary)}
svg.stage .lbl{font-size:12px;font-weight:600}
svg.stage .sm{font-size:10.5px;font-weight:500}
svg.stage .sm:not([fill]){fill:var(--muted)}
svg.stage .num{font-family:var(--mono);font-size:11.5px;font-weight:600}
svg.stage .num:not([fill]){fill:var(--secondary)}
svg.stage .big{font-family:var(--mono);font-size:15px;font-weight:600}
svg.stage .cap{font-size:9.5px;font-weight:700;letter-spacing:.07em}
svg.stage .cap:not([fill]){fill:var(--muted)}
.anim{transition:opacity .45s var(--ease),transform .6s var(--ease),fill .4s linear,stroke .4s linear,stroke-dashoffset .9s var(--ease)}
.barY{transform-box:fill-box;transform-origin:50% 100%}
.barX{transform-box:fill-box;transform-origin:0% 50%}

.ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--hairline);flex-wrap:wrap}
.btn{appearance:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--elevated);color:var(--primary);border-radius:var(--r-md);padding:6px 12px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover:not(:disabled){background:var(--subtle);border-color:var(--strong)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0d50d2;border-color:#0d50d2}
.dots{display:flex;gap:4px;margin-left:auto}
.dot{width:22px;height:5px;border-radius:99px;background:var(--border);border:0;padding:0;cursor:pointer;transition:background .2s,width .2s}
.dot:hover{background:var(--strong)}
.dot[aria-current="true"]{background:var(--accent);width:30px}
.dot.done{background:var(--accent-line);opacity:.5}


.caption{padding:12px 14px;border-top:1px solid var(--hairline);min-height:78px}
.caption .ct{font-size:14px;font-weight:700;margin-bottom:4px;letter-spacing:-0.01em}
.caption .cd{font-size:13.5px;color:var(--secondary);max-width:78ch}
.caption .cd b{color:var(--primary);font-weight:600}
.caption .cd code{font-family:var(--mono);font-size:12.5px;background:var(--subtle);padding:1px 5px;border-radius:var(--r-sm)}
.caption.alert{background:color-mix(in srgb,var(--warn-bg) 40%,transparent);border-top-color:var(--warn-line)}
.caption.danger{background:color-mix(in srgb,var(--bad-bg) 35%,transparent);border-top-color:var(--bad-line)}
.caption.good{background:color-mix(in srgb,var(--ok-bg) 35%,transparent);border-top-color:var(--ok-line)}

.pnl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.pnlcard{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.pnlcard > h4{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:9px 14px;border-bottom:1px solid var(--hairline)}
.pnlcard.win > h4{color:var(--ok-text);background:color-mix(in srgb,var(--ok-bg) 30%,transparent)}
.pnlcard.lose > h4{color:var(--bad-text);background:color-mix(in srgb,var(--bad-bg) 30%,transparent)}
.pnlcard.trap > h4{color:var(--warn-text);background:color-mix(in srgb,var(--warn-bg) 35%,transparent)}
.pnlcard ul{margin:0;padding:10px 14px 12px 28px;display:flex;flex-direction:column;gap:7px}
.pnlcard li{font-size:13px;color:var(--secondary)}
.pnlcard li b{color:var(--primary);font-weight:600}
.pnlcard li code{font-family:var(--mono);font-size:12px}

.note{border:1px solid var(--info-line);background:color-mix(in srgb,var(--info-bg) 45%,transparent);border-radius:var(--r-lg);padding:12px 14px;font-size:13px;color:var(--secondary);margin-top:16px}
.note b{color:var(--primary)}

h3.sec{margin:28px 0 4px;font-size:18px}
p.seclead{color:var(--muted);font-size:13px;max-width:78ch}
table{width:100%;border-collapse:collapse;font-size:13px}
.tablewrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);margin-top:12px}
th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--hairline);color:var(--secondary);vertical-align:top}
tr:last-child td{border-bottom:0}
td b{color:var(--primary);font-weight:600}
.chip{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:var(--r-sm);font-size:10.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok-text)}
.chip.no{background:var(--bad-bg);color:var(--bad-text)}
.chip.mid{background:var(--warn-bg);color:var(--warn-text)}
.chip.n{background:var(--subtle);color:var(--muted)}

.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:16px}
.mini{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:14px}
.mini h4{font-size:14px;margin-bottom:3px}
.mini .role{font-family:var(--mono);font-size:10.5px;color:var(--accent-text);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.mini p{font-size:12.8px;color:var(--secondary)}
.mini p + p{margin-top:7px}
.mini p strong{color:var(--primary);font-weight:600}

.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--hairline);font-size:12px;color:var(--muted);max-width:84ch}


/* persona card */
.persona{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;margin-bottom:16px;
  border:1px solid var(--accent-line);border-radius:var(--r-lg);
  background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.persona .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center}
.persona .nm{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-text);margin-bottom:3px}
.persona p{font-size:14px;color:var(--primary);max-width:82ch}

/* cast grid on the start view */
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:12px}
.castcard{display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;font-family:inherit;
  padding:13px 14px;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);
  transition:border-color .15s,background .15s}
.castcard:hover{border-color:var(--accent-line);background:var(--elevated)}
.castcard .av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);
  color:var(--accent-text);display:grid;place-items:center}
.castcard .cc{display:flex;flex-direction:column;gap:2px;min-width:0}
.castcard .nm{font-size:14px;font-weight:700;color:var(--primary)}
.castcard .rl{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-text)}
.castcard .gl2{font-size:12.5px;color:var(--secondary);line-height:1.4}

/* plain-language layer */
.caption .cp{display:flex;flex-direction:column;gap:4px}
.caption .cptext{font-size:15px;line-height:1.6;color:var(--primary);max-width:76ch}
.caption .cplabel{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}
.caption .cd{margin-top:12px;padding-top:11px;border-top:1px dashed var(--border)}

/* glossary */
.gl{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;
  border-bottom:1.5px dotted var(--accent-line);transition:background .15s}
.gl:hover{background:color-mix(in srgb,var(--accent-line) 16%,transparent)}
.glpop{position:absolute;z-index:200;background:var(--elevated);color:var(--primary);
  border:1px solid var(--accent-line);border-radius:var(--r-lg);padding:11px 13px;
  box-shadow:0 10px 30px rgba(0,0,0,.22)}
.glpop b{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--accent-text);margin-bottom:5px}
.glpop p{font-size:13px;line-height:1.5;color:var(--secondary)}

/* view-to-view navigation */
.viewnav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;
  padding-top:18px;border-top:1px solid var(--hairline);flex-wrap:wrap}
.viewnav .btn{font-size:13px;padding:9px 15px}



/* ── wallet button ────────────────────────────────────────────── */
.wbtn{appearance:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  height:28px;padding:0 11px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--surface);color:var(--secondary);
  font-family:inherit;font-size:12px;font-weight:600;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s}
.wbtn:hover{color:var(--primary);border-color:var(--strong)}
.wbtn.on{border-color:var(--ok-line);color:var(--ok-text);background:color-mix(in srgb,var(--ok-bg) 40%,transparent)}
.wbtn .wdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

/* ── the badge coin ───────────────────────────────────────────── */
.coin{position:relative;flex:none;width:172px;height:172px;display:grid;place-items:center}

.coin.on::before{content:"";position:absolute;inset:-22px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 46%,transparent) 0%,transparent 66%);
  animation:coinPulse 3.8s ease-in-out infinite}
.coin.on img{animation:coinIn 1s var(--ease) both;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.45))}

@keyframes coinIn{
  from{transform:rotateY(-170deg) scale(.5);opacity:0}
  55%{opacity:1}
  to{transform:none;opacity:1}}
@keyframes coinPulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){.coin.on::before,.coin.on img{animation:none}}
